<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสืบค้นข้อมูลผู้นำชุมชน</title>
    <!-- นำเข้า Google Identity Services สำหรับระบบ Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Sarabun', Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; text-align: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        
        /* ซ่อนส่วนเนื้อหาไว้ก่อนจนกว่าจะล็อกอิน */
        #main-content { display: none; }
        
        .login-section { text-align: center; margin-top: 50px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        input { flex: 1; min-width: 200px; }
        button { background-color: #1a73e8; color: white; border: none; cursor: pointer; padding: 10px 20px; font-weight: bold; }
        button:hover { background-color: #1557b0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #1a73e8; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .phone-btn { background-color: #34a853; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; display: inline-block; font-size: 14px;}
        .phone-btn:hover { background-color: #2b803f; }
        .loading { text-align: center; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 ระบบสืบค้นข้อมูลผู้นำชุมชน</h2>

    <!-- ส่วนล็อกอิน -->
    <div id="login-section" class="login-section">
        <p>กรุณาลงชื่อเข้าใช้ด้วยบัญชี Google เพื่อใช้งานระบบ</p>
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID" 
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
        </div>
        <!-- ปุ่มจำลองการล็อกอิน -->
        <br><button onclick="simulateLogin()">เข้าสู่ระบบเพื่อค้นหาข้อมูล</button>
    </div>

    <!-- ส่วนเนื้อหาค้นหา (จะแสดงเมื่อล็อกอินแล้ว) -->
    <div id="main-content">
        <div style="text-align: right; margin-bottom: 15px; font-size: 14px; color: #555;">
            ผู้ใช้งาน: <span id="user-email" style="font-weight: bold;">-</span>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="พิมพ์ชื่อ, ตำบล, หมู่ หรืออำเภอที่ต้องการค้นหา..." onkeyup="filterData()">
            <button onclick="filterData()">ค้นหา</button>
        </div>

        <div id="loading" class="loading">กำลังดึงข้อมูล... กรุณารอสักครู่</div>

        <table id="dataTable" style="display: none;">
            <thead>
                <tr>
                    <th>อำเภอ</th>
                    <th>ตำบล</th>
                    <th>หมู่ที่/ชื่อหมู่บ้าน</th>
                    <th>ชื่อผู้นำชุมชน</th>
                    <th>เบอร์ติดต่อ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- ข้อมูลจะถูกเติมด้วย JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // URL ของคุณถูกใส่ไว้ตรงนี้แล้ว
    const API_URL = "https://script.google.com/macros/s/AKfycbwSfK41R0RozzrU3t4knfVhFblId6PnF5jRD3e20-BRAW3FSWB0Nsttp243OU7g4s59/exec"; 
    
    let globalData = [];

    // ฟังก์ชันจัดการเมื่อล็อกอินสำเร็จ
    function handleCredentialResponse(response) {
        const responsePayload = decodeJwtResponse(response.credential);
        document.getElementById('user-email').innerText = responsePayload.email;
        showMainContent();
    }

    // ฟังก์ชันจำลองล็อกอินสำหรับทดสอบบน GitHub
    function simulateLogin() {
        document.getElementById('user-email').innerText = "เจ้าหน้าที่ศูนย์ประสานงาน";
        showMainContent();
    }

    function showMainContent() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        fetchData();
    }

    // ดึงข้อมูลจาก API ของ Google Sheets
    async function fetchData() {
        try {
            const response = await fetch(API_URL);
            const result = await response.json();
            
            if(result.status === "success") {
                globalData = result.data;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dataTable').style.display = 'table';
                renderTable(globalData);
            }
        } catch (error) {
            document.getElementById('loading').innerHTML = "<span style='color:red;'>เกิดข้อผิดพลาดในการดึงข้อมูล อาจเกิดจากการบล็อก CORS ให้ลองทดสอบเปิดผ่านหน้าเว็บ GitHub Pages จริง</span>";
            console.error("Error fetching data:", error);
        }
    }

    // แสดงผลข้อมูลลงในตาราง
    function renderTable(dataArray) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ""; 
        
        if(dataArray.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>ไม่พบข้อมูล</td></tr>";
            return;
        }

        dataArray.forEach(item => {
            const tr = document.createElement('tr');
            
            // อ่านค่าจากคอลัมน์ใน Sheets (ปรับชื่อหัวคอลัมน์ตามจริงได้เลยครับ)
            const district = item["อำเภอ"] || item["Amphoe"] || "-";
            const subDistrict = item["ตำบล"] || item["Tambon"] || "-";
            const village = item["หมู่ที่"] || item["หมู่บ้าน"] || "-";
            const name = item["ชื่อ-นามสกุล"] || item["ชื่อผู้นำชุมชน"] || item["ชื่อ"] || "-";
            const phone = item["เบอร์ติดต่อ"] || item["เบอร์โทร"] || "-";

            let phoneHtml = "-";
            if(phone && phone !== "-") {
                phoneHtml = `<a href="tel:${phone.replace(/[^0-9]/g, '')}" class="phone-btn">📞 ${phone}</a>`;
            }

            tr.innerHTML = `
                <td>${district}</td>
                <td>${subDistrict}</td>
                <td>${village}</td>
                <td>${name}</td>
                <td>${phoneHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ระบบค้นหา
    function filterData() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const filteredData = globalData.filter(item => {
            const values = Object.values(item).join(" ").toLowerCase();
            return values.includes(searchText);
        });
        renderTable(filteredData);
    }

    // ฟังก์ชันช่วยถอดรหัส JWT
    function decodeJwtResponse(token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }
</script>

</body>
</html>
